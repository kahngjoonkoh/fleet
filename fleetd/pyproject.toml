[project]
name = "fleet"
version = "0.4.0"
description = "fleetd, the per-host Fleet daemon, and the fleet CLI that installs it"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.5"]

[project.scripts]
fleet = "fleet.cli:main"
fleetd = "fleet.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
